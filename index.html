<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jordane Andrade Soares</title>
    <link rel="icon" type="image/jpeg" href="fundo.jpg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #050b18;
            background-image: url('fundo.jpg');
            background-size: 100px;
            background-repeat: repeat;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .menu {
            width: 100%;
            min-height: 100vh;
            background: rgba(5, 11, 24, 0.95);
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .menu h1 {
            width: 100%;
            font-size: 2.5rem;
            margin: 0 0 40px 0;
            text-align: center;
            white-space: nowrap;
            color: white;
            text-shadow:
                0 0 5px #00e5ff,
                0 0 15px #00e5ff,
                0 0 30px #00e5ff;
        }

        .botoes-container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
        }

        .botoes-container button {
            width: 100%;
            min-height: 130px;
            padding: 18px 15px;
            border: 2px solid #1565c0;
            border-radius: 10px;
            background: #0b1f3a;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            white-space: normal;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 10px;
        }

        .nome-codigo {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .descricao-codigo {
            font-size: 0.85rem;
            font-weight: normal;
            line-height: 1.3;
            color: #90caf9;
        }

        .botoes-container button:hover {
            transform: scale(1.05);
            background: #1565c0;
            border-color: #00e5ff;
            box-shadow:
                0 0 10px rgba(0, 229, 255, 0.5),
                0 0 20px rgba(0, 229, 255, 0.2);
        }

        .botoes-container button:active {
            transform: scale(0.97);
        }

        #jogo-aberto {
            width: 100%;
            max-width: 1400px;
            margin-top: 30px;
            display: none;
        }

        #iframe-jogo {
            width: 100%;
            height: 800px;
            border: 2px solid #1565c0;
            border-radius: 10px;
            background: #050b18;
            display: block;
        }

        .rodape-container {
            width: 100%;
            height: 650px;
            border: none;
            display: block;
        }

        @media (max-width: 767px) {
            body {
                width: 100%;
                min-height: 100dvh;
                display: block;
                overflow-y: auto;
                overflow-x: hidden;
            }

            .menu {
                width: 100%;
                min-height: 100dvh;
                height: auto;
                padding: 20px 15px 30px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                background: rgba(5, 11, 24, 0.97);
            }

            .menu h1 {
                width: 100%;
                font-size: 1.5rem;
                margin: 0 0 20px 0;
                text-align: center;
                white-space: normal;
            }

            .botoes-container {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .botoes-container button,
            .botoes-container button:first-child {
                display: flex;
                flex-direction: column;
                width: 100%;
                min-height: 90px;
                margin: 0;
                padding: 12px 10px;
                font-size: 14px;
                line-height: 1.2;
                white-space: normal;
            }

            .nome-codigo {
                font-size: 1rem;
            }

            .descricao-codigo {
                font-size: 0.8rem;
            }

            .botoes-container button:hover {
                transform: none;
            }

            #jogo-aberto {
                width: 100%;
                margin-top: 20px;
            }

            #iframe-jogo {
                width: 100%;
                height: 700px;
                border-radius: 8px;
            }

            .rodape-container {
                height: 650px;
            }
        }

        @media (max-width: 400px) {
            .menu {
                padding: 16px 12px 25px;
            }

            .menu h1 {
                font-size: 1.3rem;
                margin-bottom: 16px;
            }

            .botoes-container {
                gap: 8px;
            }

            .botoes-container button {
                min-height: 90px;
                padding: 10px 8px;
                font-size: 13px;
            }

            .nome-codigo {
                font-size: 0.95rem;
            }

            .descricao-codigo {
                font-size: 0.75rem;
            }

            #iframe-jogo {
                height: 650px;
            }

            .rodape-container {
                height: 650px;
            }
        }

        @media (min-width: 1400px) {
            .botoes-container {
                max-width: 1400px;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: 20px;
            }
        }
    </style>

    <script>
        function abrirJogo(url) {
            let iframe_jogo = document.getElementById("iframe-jogo");
            let jogo_aberto = document.getElementById("jogo-aberto");

            // Verifica se a área do jogo está visível e se o URL clicado é o mesmo que já está aberto
            if (jogo_aberto.style.display === "block" && iframe_jogo.getAttribute("src") === url) {
                // Se for o mesmo jogo, oculta a div e limpa o iframe
                jogo_aberto.style.display = "none";
                iframe_jogo.src = ""; // Isso impede que o jogo continue rodando e consumindo memória escondido
                return; // Interrompe a função para não executar o código abaixo
            }

            // Se for um jogo diferente (ou se nenhum estiver aberto), carrega e exibe
            iframe_jogo.src = url;
            jogo_aberto.style.display = "block";

            jogo_aberto.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }
    </script>
</head>

<body>

    <div class="menu">

        <h1>MEUS CÓDIGOS</h1>

        <div class="botoes-container">

            <button onclick="abrirJogo('card_game/index_card_game.html')">
                <span class="nome-codigo">TCG</span>
                <span class="descricao-codigo">
                    Mine jogo de cartas em estilo TCG.
                </span>
            </button>

            <button onclick="abrirJogo('amogus/amogus.html')">
                <span class="nome-codigo">Amogus</span>
                <span class="descricao-codigo">
                    Jogo endless runner inspirado em Among Us e T-Rex Game.
                </span>
            </button>

            <button onclick="abrirJogo('sapo/sapo.html')">
                <span class="nome-codigo">Sapo</span>
                <span class="descricao-codigo">
                    Loop de animação de um sapo.
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/corrida3D.html')">
                <span class="nome-codigo">Corrida 3D</span>
                <span class="descricao-codigo">
                    Jogo endless runner com um carro em um ambiente tridimensional.
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/nave.html')">
                <span class="nome-codigo">Nave Espacial</span>
                <span class="descricao-codigo">
                    Controle uma nave espacial e enfrente asteroides.
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/jogo_da_velha.html')">
                <span class="nome-codigo">Jogo da Velha</span>
                <span class="descricao-codigo">
                    Jogo da Velha PvE.
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/jogo_da_vida.html')">
                <span class="nome-codigo">Jogo da Vida</span>
                <span class="descricao-codigo">
                    Simulação baseada nas regras do autômato celular de Conway.
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/transformador.html')">
                <span class="nome-codigo">Transformador de Imagens</span>
                <span class="descricao-codigo">
                    Ferramenta para transformar uma imagem em outra.
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/treinador.html')">
                <span class="nome-codigo">Comparador de Imagens</span>
                <span class="descricao-codigo">
                    Ferramenta para comparar imagens (retorna o quanto parecida elas são).
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/gerador_de_qrcode.html')">
                <span class="nome-codigo">Gerador de QRCode</span>
                <span class="descricao-codigo">
                    Crie códigos QR a partir do que fornecer.
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/damas.html')">
                <span class="nome-codigo">Damas</span>
                <span class="descricao-codigo">
                    Jogo de damas PvP (local).
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/chuva_verde.html')">
                <span class="nome-codigo">Chuva verde</span>
                <span class="descricao-codigo">
                    Capture o quadrado verde que cai para obter pontos.
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/queda.html')">
                <span class="nome-codigo">Queda</span>
                <span class="descricao-codigo">
                    Pule para sobreviver a ser esmagado no topo da tela.
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/portas_logicas.html')">
                <span class="nome-codigo">Portas Lógicas</span>
                <span class="descricao-codigo">
                    Experimente e visualize o funcionamento de portas lógicas.
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/movimento.html')">
                <span class="nome-codigo">Censor de movimento</span>
                <span class="descricao-codigo">
                    Uze o censor de movimento para detectar movimento (pode não funcionar em qualquer aparelho).
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/snake/snake.html')">
                <span class="nome-codigo">Snake</span>
                <span class="descricao-codigo">
                    Controle uma cobra, coma maçãs e evite tocar no próprio corpo. Você pode deixar o bot jogar por você.
                </span>
            </button>

            <button onclick="abrirJogo('jogos_simples/labirintoQRCode.html')">
                <span class="nome-codigo">Labirinto QR Code</span>
                <span class="descricao-codigo">
                    Navegue por um labirinro no formato do QR Code que criar com sua entrada.
                </span>
            </button>

        </div>

        <div id="jogo-aberto">
            <iframe
                id="iframe-jogo"
                src=""
                title="Jogo">
            </iframe>
        </div>

    </div>

    <iframe
        class="rodape-container"
        src="rodape.html"
        title="Rodapé">
    </iframe>

</body>
</html>
