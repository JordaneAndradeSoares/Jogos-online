<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Vida de Conway</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        canvas {
            background-color: #34495e;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            border: 2px solid #bdc3c7;
            cursor: pointer;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #3498db;
        }

        button.active {
            background-color: #e74c3c;
        }

        button.active:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <h1>Jogo da Vida</h1>
    <canvas id="gameCanvas"></canvas>
    
    <div class="controls">
        <button id="btnPlay">Iniciar</button>
        <button id="btnRandom">Gerar Aleatório</button>
        <button id="btnClear">Limpar</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const btnPlay = document.getElementById('btnPlay');
        const btnRandom = document.getElementById('btnRandom');
        const btnClear = document.getElementById('btnClear');

        const resolution = 10;
        canvas.width = 600;
        canvas.height = 400;

        const COLS = canvas.width / resolution;
        const ROWS = canvas.height / resolution;

        let grid = buildGrid();
        let isPlaying = false;
        let animationId;

        // Cria a matriz inicial preenchida com zeros (células mortas)
        function buildGrid() {
            return new Array(COLS).fill(null)
                .map(() => new Array(ROWS).fill(0));
        }

        // Desenha a grade na tela
        function render(grid) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let col = 0; col < grid.length; col++) {
                for (let row = 0; row < grid[col].length; row++) {
                    const cell = grid[col][row];
                    ctx.beginPath();
                    ctx.rect(col * resolution, row * resolution, resolution, resolution);
                    ctx.fillStyle = cell ? '#2ecc71' : '#34495e';
                    ctx.fill();
                    ctx.stroke();
                    ctx.strokeStyle = '#2c3e50';
                }
            }
        }

        // Calcula a próxima geração baseada nas regras de Conway
        function nextGen(grid) {
            const nextGrid = grid.map(arr => [...arr]);

            for (let col = 0; col < grid.length; col++) {
                for (let row = 0; row < grid[col].length; row++) {
                    const cell = grid[col][row];
                    let numNeighbors = 0;

                    // Verifica os 8 vizinhos da célula
                    for (let i = -1; i < 2; i++) {
                        for (let j = -1; j < 2; j++) {
                            if (i === 0 && j === 0) continue;
                            
                            const x_cell = col + i;
                            const y_cell = row + j;

                            // Garante que não saia dos limites do canvas
                            if (x_cell >= 0 && y_cell >= 0 && x_cell < COLS && y_cell < ROWS) {
                                numNeighbors += grid[x_cell][y_cell];
                            }
                        }
                    }

                    // Aplicando as regras
                    if (cell === 1 && numNeighbors < 2) {
                        nextGrid[col][row] = 0; // Morre por subpopulação
                    } else if (cell === 1 && numNeighbors > 3) {
                        nextGrid[col][row] = 0; // Morre por superpopulação
                    } else if (cell === 0 && numNeighbors === 3) {
                        nextGrid[col][row] = 1; // Nasce por reprodução
                    }
                }
            }
            return nextGrid;
        }

        // Loop principal do jogo
        function update() {
            grid = nextGen(grid);
            render(grid);
            if (isPlaying) {
                // Controla a velocidade (aproximadamente 10 frames por segundo)
                setTimeout(() => {
                    animationId = requestAnimationFrame(update);
                }, 100);
            }
        }

        // Interação com o mouse para desenhar células na tela
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const col = Math.floor(x / resolution);
            const row = Math.floor(y / resolution);
            
            // Alterna o estado da célula clicada
            grid[col][row] = grid[col][row] ? 0 : 1;
            render(grid);
        });

        // Controles dos botões
        btnPlay.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                btnPlay.textContent = 'Pausar';
                btnPlay.classList.add('active');
                update();
            } else {
                btnPlay.textContent = 'Iniciar';
                btnPlay.classList.remove('active');
                cancelAnimationFrame(animationId);
            }
        });

        btnRandom.addEventListener('click', () => {
            for (let col = 0; col < COLS; col++) {
                for (let row = 0; row < ROWS; row++) {
                    grid[col][row] = Math.random() > 0.85 ? 1 : 0;
                }
            }
            render(grid);
        });

        btnClear.addEventListener('click', () => {
            grid = buildGrid();
            render(grid);
            if (isPlaying) {
                isPlaying = false;
                btnPlay.textContent = 'Iniciar';
                btnPlay.classList.remove('active');
                cancelAnimationFrame(animationId);
            }
        });

        // Renderização inicial
        render(grid);
    </script>
</body>
</html>
