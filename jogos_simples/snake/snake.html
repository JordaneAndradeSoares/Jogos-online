<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake - Com Bot</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 10px;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: auto;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: min(90vw, 600px, calc((100vh - 240px) * 4 / 3));
            aspect-ratio: 4 / 3;
            background-color: rgb(255, 255, 255);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            flex-shrink: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 5px;
        }
        #ui-pontos {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: clamp(16px, 4vw, 30px);
            font-weight: bold;
            font-style: italic;
            color: black;
            pointer-events: none;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 5px;
            z-index: 10;
        }
        #game-over-screen h1 {
            font-size: clamp(20px, 5vw, 40px);
            color: black;
            font-style: italic;
            margin-bottom: 10px;
        }
        #btn-reiniciar {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
            pointer-events: auto;
        }
        
        /* Botão do Modo Automático */
        #container-auto {
            margin-top: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        #btn-auto {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #btn-auto:active {
            transform: scale(0.95);
        }
        #btn-auto.ligado {
            background-color: #27ae60;
        }

        #controles-virtuais {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            width: 100%;
            flex-shrink: 0;
        }
        .linha-controles {
            display: flex;
            gap: 12px;
        }
        .btn-direcao {
            width: 60px;
            height: 60px;
            padding: 0;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.1s, opacity 0.1s;
        }
        .btn-direcao:hover:not(:disabled) {
            background-color: rgba(255, 255, 255, 0.3);
        }
        .btn-direcao:active:not(:disabled) {
            background-color: rgba(255, 255, 255, 0.5);
        }
        .btn-direcao:disabled {
            background-color: rgba(128, 128, 128, 0.5);
            border-color: rgba(128, 128, 128, 0.4);
            color: rgba(255, 255, 255, 0.35);
            cursor: not-allowed;
            opacity: 0.7;
        }
        @media (max-height: 700px) {
            body { padding: 5px; }
            #game-container { width: min(90vw, 480px, calc((100vh - 200px) * 4 / 3)); }
            #controles-virtuais { margin-top: 6px; gap: 5px; }
            .btn-direcao { width: 48px; height: 48px; font-size: 22px; }
            #btn-auto { padding: 8px 15px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="jogo" width="800" height="600"></canvas>
        <div id="ui-pontos">
            Pontos: <span id="pontos">0</span>
        </div>
        <div id="game-over-screen">
            <h1>Game over!</h1>
            <p>A cobra se mordeu!</p>
            <button id="btn-reiniciar" onclick="reiniciarJogo()">
                Reiniciar Jogo
            </button>
        </div>
    </div>

    <!-- Novo botão para ligar/desligar a máquina -->
    <div id="container-auto">
        <button id="btn-auto" onclick="alternarModoAutomatico()">Bot: OFF</button>
    </div>

    <div id="controles-virtuais">
        <div class="linha-controles">
            <button class="btn-direcao" id="btn-up" type="button">⬆️</button>
        </div>
        <div class="linha-controles">
            <button class="btn-direcao" id="btn-left" type="button">⬅️</button>
            <button class="btn-direcao" id="btn-down" type="button">⬇️</button>
            <button class="btn-direcao" id="btn-right" type="button">➡️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('jogo');
        const contexto = canvas.getContext('2d');
        const spanPontos = document.getElementById('pontos');
        const telaGameOver = document.getElementById('game-over-screen');
        const botaoCima = document.getElementById('btn-up');
        const botaoBaixo = document.getElementById('btn-down');
        const botaoEsquerda = document.getElementById('btn-left');
        const botaoDireita = document.getElementById('btn-right');
        const botaoAuto = document.getElementById('btn-auto');
        
        let contextoAudio;
        let modoAutomatico = false; // <-- Variável que controla a IA

        function inicializarAudio() {
            if (!contextoAudio) {
                contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (contextoAudio.state === 'suspended') {
                contextoAudio.resume();
            }
        }

        function tocarSomMoeda() {
            if (!contextoAudio) return;
            const oscilador = contextoAudio.createOscillator();
            const controleVolume = contextoAudio.createGain();
            oscilador.type = 'square';
            oscilador.connect(controleVolume);
            controleVolume.connect(contextoAudio.destination);
            const agora = contextoAudio.currentTime;
            oscilador.frequency.setValueAtTime(987.77, agora); 
            oscilador.frequency.setValueAtTime(1318.51, agora + 0.1); 
            controleVolume.gain.setValueAtTime(0.1, agora);
            controleVolume.gain.exponentialRampToValueAtTime(0.00001, agora + 0.4);
            oscilador.start(agora);
            oscilador.stop(agora + 0.5);
        }
        
        const largura = canvas.width;
        const altura = canvas.height;
        const velocidade = 10;
        const tamanho_bloco = 20;
        
        let x_cobra;
        let y_cobra;
        let x_controle;
        let y_controle;
        let x_maca;
        let y_maca;
        let pontos;
        let lista_cobra;
        let comprimento_inicial;
        let morreu;

        function randint(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function sortearMaca() {
            x_maca = Math.floor(randint(0, largura - tamanho_bloco) / tamanho_bloco) * tamanho_bloco;
            y_maca = Math.floor(randint(0, altura - tamanho_bloco) / tamanho_bloco) * tamanho_bloco;
        }

        function atualizarBotoes() {
            botaoCima.disabled = false;
            botaoBaixo.disabled = false;
            botaoEsquerda.disabled = false;
            botaoDireita.disabled = false;
            
            if (y_controle === velocidade) botaoCima.disabled = true;
            if (y_controle === -velocidade) botaoBaixo.disabled = true;
            if (x_controle === velocidade) botaoEsquerda.disabled = true;
            if (x_controle === -velocidade) botaoDireita.disabled = true;
            
            if (morreu || modoAutomatico) {
                // Desativa os botões manuais quando o bot ou game over estiver ativo
                botaoCima.disabled = true;
                botaoBaixo.disabled = true;
                botaoEsquerda.disabled = true;
                botaoDireita.disabled = true;
            }
        }

        function alternarModoAutomatico() {
            inicializarAudio();
            modoAutomatico = !modoAutomatico;
            
            if (modoAutomatico) {
                botaoAuto.innerText = "Bot: ON";
                botaoAuto.classList.add('ligado');
                if (morreu) reiniciarJogo(); // Inicia o jogo sozinho se estiver no game over
            } else {
                botaoAuto.innerText = "Bot: OFF";
                botaoAuto.classList.remove('ligado');
            }
            atualizarBotoes();
        }

        function iniciarJogo() {
            inicializarAudio(); 
            x_cobra = largura / 2;
            y_cobra = altura / 2;
            x_controle = velocidade;
            y_controle = 0;
            pontos = 0;
            lista_cobra = [];
            comprimento_inicial = 5;
            morreu = false;
            spanPontos.innerText = pontos;
            telaGameOver.style.display = "none";
            sortearMaca();
            atualizarBotoes();
        }

        function desenharRetangulo(x, y, cor) {
            contexto.fillStyle = cor;
            contexto.fillRect(x, y, tamanho_bloco, tamanho_bloco);
        }

        function colisao(x1, y1, x2, y2) {
            return (
                x1 < x2 + tamanho_bloco &&
                x1 + tamanho_bloco > x2 &&
                y1 < y2 + tamanho_bloco &&
                y1 + tamanho_bloco > y2
            );
        }

        function mudarDirecao(direcao) {
            if (morreu) return;
            
            if (direcao === 'esquerda' && x_controle !== velocidade) {
                x_controle = -velocidade; y_controle = 0;
            } else if (direcao === 'direita' && x_controle !== -velocidade) {
                x_controle = velocidade; y_controle = 0;
            } else if (direcao === 'cima' && y_controle !== velocidade) {
                y_controle = -velocidade; x_controle = 0;
            } else if (direcao === 'baixo' && y_controle !== -velocidade) {
                y_controle = velocidade; x_controle = 0;
            }
            atualizarBotoes();
        }

        // --- INTELIGÊNCIA ARTIFICIAL DA COBRA ---
        function pensarComoBot() {
            if (!modoAutomatico || morreu) return;

            // Pega as direções possíveis (ignora a ré, pois a cobra não pode dar 180 graus)
            let possiveis = [];
            if (y_controle !== velocidade) possiveis.push('cima');
            if (y_controle !== -velocidade) possiveis.push('baixo');
            if (x_controle !== velocidade) possiveis.push('esquerda');
            if (x_controle !== -velocidade) possiveis.push('direita');

            // Embaralha levemente para a cobra não ficar presa num looping
            possiveis.sort(() => Math.random() - 0.5);

            let melhorDirecao = null;
            let menorDistancia = Infinity;

            for (let direcao of possiveis) {
                let simX = x_cobra;
                let simY = y_cobra;

                // Simula 1 passo na direção
                if (direcao === 'cima') simY -= velocidade;
                if (direcao === 'baixo') simY += velocidade;
                if (direcao === 'esquerda') simX -= velocidade;
                if (direcao === 'direita') simX += velocidade;

                // Simula a travessia das bordas
                if (simX >= largura) simX = 0;
                if (simX < 0) simX = largura - tamanho_bloco;
                if (simY >= altura) simY = 0;
                if (simY < 0) simY = altura - tamanho_bloco;

                // Verifica se baterá no corpo no próximo frame
                let perigoso = false;
                for (let i = 0; i < lista_cobra.length - 1; i++) {
                    if (simX === lista_cobra[i].x && simY === lista_cobra[i].y) {
                        perigoso = true;
                        break;
                    }
                }

                // Se o caminho for seguro, calcula a distância até a maçã
                if (!perigoso) {
                    let dist = Math.abs(simX - x_maca) + Math.abs(simY - y_maca);
                    if (dist < menorDistancia) {
                        menorDistancia = dist;
                        melhorDirecao = direcao;
                    }
                }
            }

            // Se achou um caminho seguro, muda a direção
            if (melhorDirecao) {
                mudarDirecao(melhorDirecao);
            }
        }

        function gameLoop() {
            if (morreu) return;
            
            // Se o modo automático estiver ligado, chama a IA antes de mover
            if (modoAutomatico) {
                pensarComoBot();
            }

            contexto.fillStyle = "white";
            contexto.fillRect(0, 0, largura, altura);
            
            x_cobra += x_controle;
            y_cobra += y_controle;
            
            if (x_cobra >= largura) x_cobra = 0;
            if (x_cobra < 0) x_cobra = largura - tamanho_bloco;
            if (y_cobra >= altura) y_cobra = 0;
            if (y_cobra < 0) y_cobra = altura - tamanho_bloco;
            
            if (colisao(x_cobra, y_cobra, x_maca, y_maca)) {
                sortearMaca();
                pontos += 1;
                comprimento_inicial += 1;
                spanPontos.innerText = pontos;
                tocarSomMoeda();
            }
            
            const cabeca = { x: x_cobra, y: y_cobra };
            lista_cobra.push(cabeca);
            
            if (lista_cobra.length > comprimento_inicial) {
                lista_cobra.shift();
            }
            
            for (let indice = 0; indice < lista_cobra.length - 1; indice++) {
                if (x_cobra === lista_cobra[indice].x && y_cobra === lista_cobra[indice].y) {
                    morreu = true;
                    telaGameOver.style.display = "flex";
                    atualizarBotoes();
                    break;
                }
            }
            
            desenharRetangulo(x_maca, y_maca, "rgb(255, 0, 0)");
            for (let indice = 0; indice < lista_cobra.length; indice++) {
                desenharRetangulo(lista_cobra[indice].x, lista_cobra[indice].y, "rgb(0, 255, 0)");
            }
        }
        
        botaoCima.addEventListener('click', function() {
            inicializarAudio(); if (!botaoCima.disabled) mudarDirecao('cima');
        });
        botaoBaixo.addEventListener('click', function() {
            inicializarAudio(); if (!botaoBaixo.disabled) mudarDirecao('baixo');
        });
        botaoEsquerda.addEventListener('click', function() {
            inicializarAudio(); if (!botaoEsquerda.disabled) mudarDirecao('esquerda');
        });
        botaoDireita.addEventListener('click', function() {
            inicializarAudio(); if (!botaoDireita.disabled) mudarDirecao('direita');
        });
        
        function reiniciarJogo() {
            iniciarJogo();
        }
        
        iniciarJogo();
        setInterval(gameLoop, 1000 / 30);
    </script>
</body>
</html>
